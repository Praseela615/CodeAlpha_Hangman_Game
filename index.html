
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeAlpha Hangman Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #17243a;
      color: white;
      text-align: center;
      padding: 30px 12px;
    }

    .game {
      max-width: 500px;
      margin: auto;
      padding: 25px;
      background: #263750;
      border-radius: 15px;
    }

    h1 { color: #ffd166; }

    #word {
      font-size: 30px;
      letter-spacing: 8px;
      margin: 25px 0;
    }

    #drawing {
      white-space: pre;
      font-size: 22px;
      line-height: 1.3;
    }

    #letters {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 7px;
      margin: 20px 0;
    }

    button {
      padding: 10px 4px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    #restart {
      background: #ffd166;
      padding: 12px 20px;
    }
  </style>
</head>
<body>
  <div class="game">
    <h1>🎯 Hangman Game</h1>
    <p>Guess the hidden word, one letter at a time!</p>

    <div id="drawing"></div>
    <p id="word"></p>
    <p>Wrong guesses: <span id="wrong">0</span> / 6</p>
    <p id="message">Choose a letter to start.</p>

    <div id="letters"></div>
    <button id="restart">New Game</button>
    <p>Created as part of my CodeAlpha project.</p>
  </div>

  <script>
    const words = [
      "PYTHON", "COMPUTER", "GITHUB",
      "PROGRAM", "HANGMAN", "CODING"
    ];

    const stages = [
` +---+
 |   |
     |
     |
     |
=========`,
` +---+
 |   |
 O   |
     |
     |
=========`,
` +---+
 |   |
 O   |
 |   |
     |
=========`,
` +---+
 |   |
 O   |
/|   |
     |
=========`,
` +---+
 |   |
 O   |
/|\\  |
     |
=========`,
` +---+
 |   |
 O   |
/|\\  |
/    |
=========`,
` +---+
 |   |
 O   |
/|\\  |
/ \\  |
=========`
    ];

    let answer, guessed, mistakes, finished;

    const drawing = document.getElementById("drawing");
    const word = document.getElementById("word");
    const wrong = document.getElementById("wrong");
    const message = document.getElementById("message");
    const letters = document.getElementById("letters");

    function startGame() {
      answer = words[Math.floor(Math.random() * words.length)];
      guessed = [];
      mistakes = 0;
      finished = false;
      message.textContent = "Choose a letter to start.";
      render();
    }

    function render() {
      drawing.textContent = stages[mistakes];
      wrong.textContent = mistakes;
      word.textContent = [...answer]
        .map(letter => guessed.includes(letter) ? letter : "_")
        .join(" ");

      letters.replaceChildren();

      for (const letter of "ABCDEFGHIJKLMNOPQRSTUVWXYZ") {
        const button = document.createElement("button");
        button.textContent = letter;
        button.disabled = guessed.includes(letter) || finished;
        button.addEventListener("click", () => guess(letter));
        letters.appendChild(button);
      }
    }

    function guess(letter) {
      if (finished || guessed.includes(letter)) return;

      guessed.push(letter);

      if (!answer.includes(letter)) mistakes++;

      if ([...answer].every(char => guessed.includes(char))) {
        finished = true;
        message.textContent = "🎉 You won! Great job!";
      } else if (mistakes >= 6) {
        finished = true;
        message.textContent = "Game over! The word was " + answer + ".";
      } else {
        message.textContent = answer.includes(letter)
          ? "Correct guess! Keep going."
          : "Wrong guess! Try another letter.";
      }

      render();
    }

    document.getElementById("restart")
      .addEventListener("click", startGame);

    startGame();
  </script>
</body>
</html>
